<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Admin · Maison de Beauté{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  {% block head %}{% endblock %}

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Manrope", Arial, sans-serif;
      background: #f5f5f4;
      color: #1a1a1a;
      min-height: 100vh;
    }

    /* ── Top nav ── */
    .admin-nav {
      background: #1a1a1a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .admin-nav__brand {
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.04em;
      text-decoration: none;
      color: #fff;
    }
    .admin-nav__brand em { color: #c8a97e; font-style: normal; }
    .admin-nav__links {
      display: flex;
      gap: 4px;
      list-style: none;
    }
    .admin-nav__links a {
      color: #ccc;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .admin-nav__links a:hover,
    .admin-nav__links a.active {
      background: #333;
      color: #fff;
    }
    .admin-nav__logout {
      color: #f88 !important;
    }
    .admin-nav__logout:hover {
      background: #3a1a1a !important;
      color: #faa !important;
    }

    /* ── Page shell ── */
    .admin-shell {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 32px 64px;
    }

    .page-heading {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 32px;
    }

    /* ── Stat cards ── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      text-decoration: none;
      color: inherit;
      display: block;
      transition: box-shadow 0.15s, transform 0.15s;
    }
    a.stat-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      transform: translateY(-2px);
    }
    .stat-card__label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #888;
      margin-bottom: 10px;
    }
    .stat-card__value {
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1;
    }
    .stat-card__sub {
      font-size: 0.8rem;
      color: #888;
      margin-top: 6px;
    }
    .stat-card__value--icon {
      font-size: 1.6rem;
    }

    /* ── Tables ── */
    .table-wrapper {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th {
      background: #1a1a1a;
      color: #fff;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 14px 16px;
      text-align: left;
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
      vertical-align: top;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }

    .label-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .label-badge--buy    { background: #d4edda; color: #1a6b3a; }
    .label-badge--notbuy { background: #fde8e8; color: #9b1c1c; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #888;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

<nav class="admin-nav" aria-label="Admin navigation">
  <a class="admin-nav__brand" href="/admin">Maison <em>Admin</em></a>
  <ul class="admin-nav__links">
    <li><a href="{{ url_for('admin.admin_dashboard') }}"
           {% if request.endpoint == 'admin.admin_dashboard' %}class="active"{% endif %}>Dashboard</a></li>
    <li><a href="{{ url_for('admin.review_moderation') }}"
           {% if request.endpoint == 'admin.review_moderation' %}class="active"{% endif %}>Reviews</a></li>
    <li><a href="{{ url_for('admin.overridden_reviews') }}"
           {% if request.endpoint == 'admin.overridden_reviews' %}class="active"{% endif %}>Label Corrections</a></li>
    <li><a href="{{ url_for('admin.statistics') }}"
           {% if request.endpoint == 'admin.statistics' %}class="active"{% endif %}>Statistics</a></li>
    <li><a href="{{ url_for('admin.admin_logout') }}" class="admin-nav__logout">Log out</a></li>
  </ul>
</nav>

<div class="admin-shell">
  {% block content %}{% endblock %}
</div>

</body>
</html>
